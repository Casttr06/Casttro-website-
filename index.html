<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CASTTRO</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
        background: #000;
        color: #fff;
        font-family: "Anton", sans-serif;
      }

      body {
        overflow-x: hidden;
      }

      .intro {
        position: fixed;
        inset: 0;
        z-index: 20;
        background: #000;
        cursor: pointer;
      }

      .intro-video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .intro-shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.05),
          rgba(0, 0, 0, 0.35)
        );
        pointer-events: none;
      }

      .intro-hint {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 32px;
        text-align: center;
        color: rgba(255, 255, 255, 0.72);
        font-size: 14px;
        letter-spacing: 0.4em;
        animation: blink 1.8s ease-in-out infinite;
        pointer-events: none;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 0.35;
        }

        50% {
          opacity: 1;
        }
      }

      .site {
        min-height: 100vh;
        background: #000;
      }

      .hero {
        position: relative;
        min-height: 100vh;
        background-image: url("assets/vlcsnap-2026-03-20-18h41m23s856.png");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .topnav {
        position: absolute;
        top: 28px;
        left: 0;
        right: 0;
        z-index: 5;
        display: flex;
        justify-content: space-around;
        align-items: center;
        gap: 16px;
        padding: 0 40px;
      }

      .topnav a {
        color: #ff0000;
        font-size: clamp(20px, 2.4vw, 40px);
        letter-spacing: 0.04em;
        text-decoration: none;
        text-transform: uppercase;
        transition: opacity 0.2s ease, transform 0.2s ease;
      }

      .topnav a:hover {
        opacity: 0.7;
        transform: translateY(-2px);
      }

      .brand {
        color: #ff0000;
        font-size: clamp(80px, 16vw, 260px);
        letter-spacing: 0.02em;
        line-height: 1;
        text-transform: uppercase;
        user-select: none;
      }

      .section {
        min-height: 100vh;
        padding: 120px 40px;
        background: #000;
        color: #ff0000;
      }

      .section h2 {
        font-size: clamp(56px, 10vw, 160px);
        line-height: 1;
      }

      @media (max-width: 720px) {
        .topnav {
          top: 18px;
          flex-wrap: wrap;
          justify-content: center;
          padding: 0 16px;
        }

        .topnav a {
          font-size: 16px;
        }

        .intro-hint {
          font-size: 12px;
          letter-spacing: 0.28em;
        }
      }
    </style>
  </head>

  <body>
    <div
      class="intro"
      id="intro"
      role="button"
      tabindex="0"
      aria-label="Enter CASTTRO site"
    >
      <video
        class="intro-video"
        id="introVideo"
        src="assets/hero-loop.mp4"
        autoplay
        muted
        playsinline
      ></video>

      <div class="intro-shade"></div>
      <div class="intro-hint">CLICK TO ENTER</div>
    </div>

    <main class="site">
      <section class="hero" id="home">
        <nav class="topnav" aria-label="Primary navigation">
          <a href="#home">HOME</a>
          <a href="#about">ABOUT</a>
          <a href="#music">MUSIC</a>
          <a href="#visuals">VISUALS</a>
          <a href="#contact">CONTACT</a>
        </nav>

        <h1 class="brand">CASTTRO</h1>
      </section>

      <section class="section" id="about">
        <h2>ABOUT</h2>
      </section>

      <section class="section" id="music">
        <h2>MUSIC</h2>
      </section>

      <section class="section" id="visuals">
        <h2>VISUALS</h2>
      </section>

      <section class="section" id="contact">
        <h2>CONTACT</h2>
      </section>
    </main>

    <script>
      const intro = document.getElementById("intro");
      const video = document.getElementById("introVideo");

      function enterSite() {
        intro.style.display = "none";
      }

      intro.addEventListener("click", enterSite);

      intro.addEventListener("keydown", function (event) {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          enterSite();
        }
      });

      video.addEventListener("ended", enterSite);

      video.play().catch(function () {
        video.muted = true;
        video.play().catch(function () {});
      });
    </script>
  </body>
</html>
